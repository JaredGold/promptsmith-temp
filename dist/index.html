<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promptsmith of Lumen</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#201A4B;--ink2:#3A3170;--paper:#F3EEFF;--lumen:#FFC53D;--mint:#37E2B8;--static:#8C87A6;--ember:#FF5D73;
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#12102B;overscroll-behavior:none}
body{font-family:Fredoka,ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 58%,rgba(18,16,43,.34) 100%)}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(8px + var(--st)) calc(10px + var(--sr)) 0 calc(10px + var(--sl))}
#hud>*{pointer-events:auto}
#hp{position:absolute;left:calc(10px + var(--sl));top:calc(8px + var(--st));width:min(38vw,200px);height:22px;background:var(--ink);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
#hp i{display:block;height:100%;width:100%;background:linear-gradient(#7CF5C8,var(--mint));border-radius:8px;transition:width .15s}
#hp b{position:absolute;inset:0;font-size:13px;line-height:16px;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 0 var(--ink)}
#sparks{position:absolute;left:calc(10px + var(--sl));top:calc(36px + var(--st));font-weight:700;font-size:16px;color:var(--lumen);text-shadow:0 2px 0 var(--ink),0 0 8px #0006}
#boonrow{position:absolute;left:calc(84px + var(--sl));top:calc(37px + var(--st));display:flex;gap:4px}
#boonrow i{width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);display:block}
#topr{position:absolute;right:calc(10px + var(--sr));top:calc(8px + var(--st));display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);font-weight:700;font-size:18px;padding:0}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#boss{position:absolute;left:50%;top:calc(8px + var(--st));transform:translateX(-50%);width:min(44vw,360px);text-align:center}
#boss span{font-weight:700;font-size:14px;color:#fff;text-shadow:0 2px 0 var(--ink)}
#boss div{height:16px;background:var(--ink);border:3px solid var(--ink);border-radius:10px;overflow:hidden;position:relative}
#boss i{display:block;height:100%;background:linear-gradient(#FF8FA0,var(--ember));width:100%;transition:width .15s}
#boss u{position:absolute;left:0;top:0;height:100%;background:repeating-linear-gradient(45deg,#BFF6FF,#BFF6FF 6px,#6FDBF2 6px,#6FDBF2 12px);width:0}
#roomtag{position:absolute;left:50%;top:calc(34px + var(--st));transform:translateX(-50%);font-weight:600;font-size:13px;color:#fff;text-shadow:0 2px 0 var(--ink);white-space:nowrap}
#hint{position:absolute;left:50%;top:calc(60px + var(--st));transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:6px 14px;font-weight:600;font-size:15px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;cursor:pointer}
/* touch */
#touch{position:absolute;inset:0;pointer-events:none}
#stickzone{position:absolute;left:0;top:70px;bottom:0;width:44%;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid #fff8;background:#201A4B55;left:calc(84px + var(--sl));bottom:calc(30px + var(--sb));top:auto}
#stick.live{bottom:auto}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
#stick:not(.live){margin:0}
#btns{position:absolute;right:var(--sr);bottom:var(--sb);width:260px;height:240px;pointer-events:none}
.tb{position:absolute;border-radius:50%;border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);pointer-events:auto;touch-action:none;padding:0;font-weight:700;font-size:13px;overflow:hidden;transform:translate(50%,50%)}
.tb.on{transform:translate(50%,50%) translateY(3px);box-shadow:0 1px 0 var(--ink);filter:brightness(1.15)}
.tb canvas{position:absolute;inset:0;width:100%;height:100%}
.tb em{position:absolute;left:0;right:0;bottom:0;height:0;background:#201A4Bbb;pointer-events:none}
.tb s{position:absolute;left:0;right:0;bottom:5px;text-decoration:none;font-size:10px;line-height:10px;color:var(--ink);font-weight:700;pointer-events:none}
#tb-atk{width:86px;height:86px;right:62px;bottom:62px;background:var(--lumen);font-size:15px}
#tb-jump{width:66px;height:66px;right:150px;bottom:48px;background:#BFE9FF}
#tb-dodge{width:66px;height:66px;right:48px;bottom:150px;background:#D9C8FF}
#tb-a0,#tb-a1,#tb-a2,#tb-a3{width:56px;height:56px;background:var(--ink2)}
#tb-a0{right:222px;bottom:44px}#tb-a1{right:210px;bottom:110px}#tb-a2{right:136px;bottom:128px}#tb-a3{right:116px;bottom:200px}
.tb.empty{opacity:.25}
body.kb .tb::after{content:attr(data-key);position:absolute;right:0;left:0;top:3px;font-size:10px;color:var(--ink);opacity:.7}
body.kb #tb-a0::after,body.kb #tb-a1::after,body.kb #tb-a2::after,body.kb #tb-a3::after{color:#fff}
/* UI */
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(10px + var(--st)) calc(10px + var(--sr)) calc(10px + var(--sb)) calc(10px + var(--sl));background:#12102Bcc;z-index:5}
#ui.soft{background:#12102B66}
#ui.clear{background:none;align-items:flex-end}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.card.wide{width:min(760px,100%)}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;border-bottom:3px solid var(--ink);background:#E4DBFF}
.ch h2{margin:0;font-size:20px;font-weight:700;flex:1;line-height:1.1}
.ch small{font-size:13px;font-weight:500;opacity:.75;display:block}
.cb{padding:12px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1}
.cf{padding:10px 12px;display:flex;gap:10px;border-top:3px solid var(--ink);background:#E4DBFF}
.btn{flex:1;min-height:50px;border-radius:14px;border:3px solid var(--ink);background:var(--lumen);box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:17px;padding:4px 12px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--paper)}.btn.mint{background:var(--mint)}
.btn:disabled{opacity:.4}
.x{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);font-weight:700;font-size:18px;flex:none;padding:0}
p{margin:0 0 8px;font-size:17px;line-height:1.35}
.big{font-size:19px;font-weight:500;line-height:1.35}
.pr{font-family:"Courier Prime",ui-monospace,Menlo,monospace;background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.3;-webkit-user-select:text;user-select:text;white-space:pre-wrap;word-break:break-word}
.pr.weak{border-color:var(--ember);background:#FFF0F2}.pr.strong{border-color:#12A886;background:#EBFFF8}
.pr.out{border-style:solid;font-family:inherit}
.tag{display:inline-block;font-weight:700;font-size:13px;padding:2px 10px;border-radius:10px;border:2px solid var(--ink);margin-bottom:8px;background:#fff}
.tag.weak{background:var(--ember);color:#fff}.tag.strong{background:var(--mint)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:#fff}.dots i.on{background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:46px;border-radius:12px;border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);font-family:"Courier Prime",ui-monospace,monospace;font-size:15px;padding:6px 10px;text-align:left;line-height:1.2}
.chip.sel{background:var(--lumen);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip.good{background:var(--mint)}.chip.bad{background:var(--ember);color:#fff}
.hole{display:inline;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-bottom:3px solid var(--ember);background:#FFE1E6;padding:0 4px;border-radius:4px}
.hole.ok{border-color:#12A886;background:#D6FFF1}
input.txt{width:100%;min-height:46px;border-radius:12px;border:3px solid var(--ink);padding:6px 10px;font:16px "Courier Prime",ui-monospace,monospace;background:#fff;color:var(--ink);margin:4px 0 10px;-webkit-user-select:text;user-select:text}
label{font-weight:600;font-size:14px;display:block}
.fb{margin-top:10px;font-weight:600;font-size:16px;padding:8px 10px;border-radius:12px;border:3px solid var(--ink)}
.fb.ok{background:var(--mint)}.fb.no{background:#FFD7DD}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;min-height:60px;border-radius:14px;border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);padding:6px 10px;text-align:left;width:100%}
.row:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.row.lock{opacity:.5;box-shadow:none}
.row canvas{position:static;width:44px;height:44px;flex:none;border-radius:12px;background:var(--ink)}
.row b{font-size:17px;display:block;line-height:1.1}.row span{font-size:13px;opacity:.8;line-height:1.2;display:block}
.row>div{flex:1;min-width:0}
.pips{display:flex;gap:3px;flex:none}.pips i{width:12px;height:16px;border:2px solid var(--ink);border-radius:4px;background:#fff}.pips i.on{background:var(--lumen)}
.cost{flex:none;font-weight:700;font-size:13px;background:var(--ink);color:var(--lumen);border-radius:10px;padding:3px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.slots{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.slot{width:60px;height:60px;border-radius:50%;border:3px solid var(--ink);background:var(--ink2);padding:0;position:relative;box-shadow:0 3px 0 var(--ink)}
.slot canvas{position:absolute;inset:0;width:100%;height:100%}
.slot.pickme{outline:4px solid var(--lumen);outline-offset:2px}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:6}
#title h1{margin:0;font-size:clamp(40px,9vw,84px);line-height:.9;font-weight:700;color:var(--lumen);text-shadow:0 4px 0 var(--ink),0 8px 0 #12102B,0 0 40px #FFC53D66;letter-spacing:-1px}
#title h1 span{display:block;font-size:.36em;color:var(--paper);letter-spacing:0;margin-bottom:8px;text-shadow:0 3px 0 var(--ink)}
#title p{color:var(--paper);max-width:30em;text-shadow:0 2px 0 var(--ink);font-weight:500}
#title .btn{flex:none;min-width:220px;font-size:22px;min-height:60px}
#title small{color:#CFC8F4;font-size:13px}
#toast{position:absolute;left:50%;top:calc(112px + var(--st));transform:translateX(-50%);z-index:7;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:92vw}
#toast div{background:var(--ink);color:var(--paper);border:3px solid var(--paper);border-radius:14px;padding:6px 14px;font-weight:600;font-size:15px;animation:tin .25s ease-out;text-align:center;max-width:100%}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;z-index:4;pointer-events:none;font-weight:700;font-size:clamp(30px,7vw,60px);color:#fff;text-shadow:0 4px 0 var(--ink),0 0 30px #000a;animation:ban 2.2s ease-out forwards}
#banner small{display:block;font-size:.4em;font-weight:600;color:var(--lumen)}
@keyframes ban{0%{transform:scale(1.6);opacity:0}12%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0}}
.mentor{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mentor canvas{position:static;width:56px;height:56px;flex:none;border-radius:16px;border:3px solid var(--ink);background:#E4DBFF}
.mentor div{background:#fff;border:3px solid var(--ink);border-radius:4px 16px 16px 16px;padding:8px 10px;font-size:16px;line-height:1.3;flex:1}
.mentor div b{display:block;font-size:13px;opacity:.7}
.boon{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.timer{height:8px;border-radius:6px;background:var(--ink);overflow:hidden;margin-bottom:8px}.timer i{display:block;height:100%;background:var(--ember);width:100%}
.blk{border-bottom:2px solid #12A886;padding-bottom:1px}.blk.b1{border-color:#3F7CF0}.blk.b2{border-color:#B8520A}
.fbx:empty{display:none}.fbx .fb{margin-top:8px}
@media(max-height:430px){.ch{padding:6px 10px 5px}.ch h2{font-size:17px}.cb{padding:6px 10px}.cf{padding:6px 10px}.btn{min-height:44px;font-size:16px}.chip{min-height:38px;font-size:14px;padding:3px 9px;box-shadow:0 2px 0 var(--ink)}.chips{margin-top:6px;gap:6px}p{font-size:16px;margin-bottom:6px}.big{font-size:17px}.pr{padding:7px 10px;font-size:15px}input.txt{min-height:40px;margin:6px 0 4px}.row{min-height:52px}.tag{margin-bottom:5px}}
@media(max-width:430px){.big{font-size:17px}.pr{font-size:15px;padding:8px 10px}.card{border-radius:16px}}
@media(max-width:520px){#boss{top:calc(62px + var(--st));width:74vw}#btns{transform:scale(.8);transform-origin:bottom right}#stickzone{width:40%}#stick{left:calc(64px + var(--sl))}}
@media (prefers-reduced-motion:reduce){.card,#toast div{animation:none}}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c3d"></canvas>
<canvas id="fx"></canvas>
<div id="vig"></div>
<div id="hud" class="hide">
  <div id="hp"><i></i><b></b></div>
  <div id="sparks"></div>
  <div id="boonrow"></div>
  <div id="boss" class="hide"><span></span><div><i></i><u></u></div></div>
  <div id="roomtag"></div>
  <div id="topr"><button class="ib" id="bmute" aria-label="Sound on or off">♪</button><button class="ib" id="bpause" aria-label="Pause">II</button></div>
  <div id="hint" class="hide"></div>
</div>
<div id="touch" class="hide">
  <div id="stickzone"><div id="stick"><i></i></div></div>
  <div id="btns">
    <button class="tb" id="tb-atk" data-k="atk" data-key="J">Hit</button>
    <button class="tb" id="tb-jump" data-k="jump" data-key="Space">Jump</button>
    <button class="tb" id="tb-dodge" data-k="dodge" data-key="K">Dodge</button>
    <button class="tb" id="tb-a0" data-k="a0" data-key="U"><canvas width="96" height="96"></canvas><em></em><s></s></button>
    <button class="tb" id="tb-a1" data-k="a1" data-key="I"><canvas width="96" height="96"></canvas><em></em><s></s></button>
    <button class="tb" id="tb-a2" data-k="a2" data-key="O"><canvas width="96" height="96"></canvas><em></em><s></s></button>
    <button class="tb" id="tb-a3" data-k="a3" data-key="P"><canvas width="96" height="96"></canvas><em></em><s></s></button>
  </div>
</div>
<div id="ui" class="hide"></div>
<div id="title">
  <h1><span>Promptsmith of</span>Lumen</h1>
  <p>The Static has muddled the land. Nothing anyone asks for comes out right. Learn to ask well, and clear the fog.</p>
  <button class="btn" id="bstart">Start</button>
  <small id="tnote"></small>
</div>
<div id="toast"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="window.__threeErr=1"></script>
<script>
'use strict';
// ---------- utils ----------
const $=(s,p)=>(p||document).querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],sgn=v=>v<0?-1:1;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const hex=c=>'#'+(c|0).toString(16).padStart(6,'0');
const mix=(a,b,t)=>{const r=lerp(a>>16&255,b>>16&255,t),g=lerp(a>>8&255,b>>8&255,t),bl=lerp(a&255,b&255,t);return (r<<16)|(g<<8)|bl|0;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dist=(a,b)=>Math.hypot(a.x-b.x,(a.y+a.h/2)-(b.y+b.h/2));

// ---------- save ----------
// Storage interface: get(key) -> string|null, set(key,string). Two interchangeable stores.
class LocalStore{get(k){return localStorage.getItem(k);}set(k,v){localStorage.setItem(k,v);}
  static usable(){try{localStorage.setItem('__ps_t','1');localStorage.removeItem('__ps_t');return true;}catch(e){return false;}}}
class MemoryStore{constructor(){this.m={};}get(k){return k in this.m?this.m[k]:null;}set(k,v){this.m[k]=v;}}
const SV={key:'promptsmith_lumen_v1',store:null,persistent:false,d:null,
  fresh(){return {v:1,sparks:0,cleared:{},ranks:{},track:null,loadout:[null,null,null,null],runes:[{t:'dodge',a:'shock'},{t:'kill',a:'bolts'}],tut:{},muted:false,runs:0};},
  load(){this.persistent=LocalStore.usable();this.store=this.persistent?new LocalStore():new MemoryStore();this.d=this.fresh();
    try{const s=this.store.get(this.key);if(s){const o=JSON.parse(s);if(o&&o.v===1)Object.assign(this.d,o);}}catch(e){}},
  save(){try{this.store.set(this.key,JSON.stringify(this.d));}catch(e){this.store=new MemoryStore();this.persistent=false;}},
  reset(){this.d=this.fresh();this.save();}
};

// ---------- audio (all synthesised) ----------
const AU={ctx:null,out:null,mg:null,sg:null,muted:false,song:null,step:0,next:0,nb:null,
  init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return;}
    try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();
      this.out=this.ctx.createGain();this.out.gain.value=this.muted?0:.9;
      const cmp=this.ctx.createDynamicsCompressor();this.out.connect(cmp);cmp.connect(this.ctx.destination);
      this.mg=this.ctx.createGain();this.mg.gain.value=.34;this.mg.connect(this.out);
      this.sg=this.ctx.createGain();this.sg.gain.value=.8;this.sg.connect(this.out);
      const n=this.ctx.sampleRate*.5,b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.nb=b;
      setInterval(()=>this.tick(),30);
    }catch(e){this.ctx=null;}},
  setMute(m){this.muted=m;if(this.out)this.out.gain.value=m?0:.9;},
  tone(f,d,type,v,f2,dl,dest){const c=this.ctx;if(!c||this.muted||!isFinite(f)||!(d>0))return;const t=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);

  if(o)Object.assign(e,o);e.mhp=e.hp;e.node=R.add(mk(MODEL[def.model||kind](e),x,e.y,0,{ol:true,sh:def.w*.55}));e.node.s=.01;e.ai.init(e);G.w.ents.push(e);AU.sfx('spawn');FX.ring(x,e.y+e.h/2,def.col||0xffffff,1.2,.5);return e;}

  if(e.spawn>0){e.spawn-=dt;n.s=e.sz*clamp(1-e.spawn/.6,.01,1);n.x=e.x;n.y=e.y;return;}
  const edt=dt*(e.slow>0?.5:1);
  if(e.stag>0){e.stag-=dt;e.stun=Math.max(e.stun,.05);}
  if(e.stun>0){e.stun-=dt;e.vx=0;if(e.fly)e.vy=0;}else e.ai.update(e,edt);
  if(!e.fly)e.vy-=GRAV*edt;
  e.x+=(e.vx+e.kx)*edt;e.y+=(e.vy+(e.fly?e.ky:0))*edt;const f=Math.max(0,1-7*dt);e.kx*=f;e.ky*=f;
  e.wall=0;const hw=e.w/2;if(e.x<w.x0+hw){e.x=w.x0+hw;e.wall=-1;}else if(e.x>w.x1-hw){e.x=w.x1-hw;e.wall=1;}
  const fl=e.fly?.25:0;if(e.y<=fl){e.y=fl;if(e.vy<0)e.vy=0;e.ground=true;}else e.ground=false;if(e.y>9)e.y=9;
  if(e.hot&&e.stun<=0&&!p.dead&&Math.abs(p.x-e.x)<hw+p.w/2-.05&&p.y<e.y+e.h&&p.y+p.h>e.y)C.hurt(e.dmg,e,sgn(p.x-e.x));
  n.x=e.x;n.y=e.y+(e.fly?Math.sin(G.t*4+e.mhp)*.1:0);n.face=e.face;n.flash=e.flash;n.s=e.sz;n.vis=!e.disg;n.rot=e.stun>0&&!e.boss?Math.sin(G.t*18)*.12:0;if(!e.def.ownSy)n.sy=1+Math.sin(G.t*(e.fly?5:7)+e.mhp)*(e.boss?.02:.045);

// ---------- world update shared by hub and runs ----------
function updWorld(dt){const w=G.w,p=G.p;
  for(const e of w.ents)if(!e.dead)updEnemy(e,dt);
  for(let i=w.ents.length-1;i>=0;i--)if(w.ents[i].dead){R.remove(w.ents[i].node);w.ents.splice(i,1);}
  // shots
  for(let i=w.shots.length-1;i>=0;i--){const s=w.shots[i];if(s.delay>0){s.delay-=dt;if(s.delay>0)continue;s.x+=p.x-(s.px==null?p.x:s.px);}
    s.t+=dt;let dead=s.t>s.life;
    if(s.home&&s.team==='p'){const t=s.tgt&&!s.tgt.dead?s.tgt:C.nearest(s.x,s.y,9);if(t){const sp=Math.hypot(s.vx,s.vy),dx=t.x-s.x,dy=t.y+t.h/2-s.y,d=Math.hypot(dx,dy)||1,k=Math.min(1,s.home*dt);s.vx=lerp(s.vx,dx/d*sp,k);s.vy=lerp(s.vy,dy/d*sp,k);}}
    s.vy-=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.upd)s.upd(s,dt);
    if(s.y<-.2&&!s.float){dead=true;if(s.onEnd)s.onEnd(s);FX.burst(s.x,0,s.c,4,3,{up:2});}

    if(!dead&&s.team==='p'){for(const e of w.ents){if(e.dead||e.spawn>0||(s.hitSet&&s.hitSet.has(e)))continue;

// ---------- graders: GRADER[type](challenge, answer) -> {grade:'strong'|'weak'|'fail', notes} ----------
// Authored rubrics only. No API calls anywhere.
const GRADER={
  fix(L,choice){return {grade:choice===L.f[3]?'strong':'weak',notes:L.f[4]};},
  write(L,a){const c=L.c;let s=0,bad=0;for(const p of a.picks){const i=c.indexOf(p);if(i>=1&&i<=3)s+=2;else if(i>3){s-=1;bad++;}}if((a.text||'').trim().length>=3)s+=1;
    return {score:s,grade:s>=5?'strong':s>=2?'weak':'fail',notes:s>=5?'Strong prompt: specific, with nothing vague.':bad?'A vague block is dragging it down. Swap it out.':'Nearly. Add another strong block, or a line of your own.'};},
  quest(L,vals){return {grade:vals.length>0&&vals.every(v=>v.trim().length>=2)?'strong':'weak',notes:''};},
  order(ch,ans){let ok=0;for(let i=0;i<ch.parts.length;i++)if(ans[i]===i)ok++;return {grade:ok===ch.parts.length?'strong':ok>=ch.parts.length-2?'weak':'fail',notes:ch.why};}
};

function flyerAI(o){return {init(e){e.s={m:'drift',t:rnd(.6,2),ph:rnd(0,6),side:pick([-1,1])};e.y=e.y||rnd(2,3.5);},

    if(s.m==='drift'){const tx=p.x+s.side*o.dist+Math.sin(s.ph*.7)*1.2,ty=p.y+o.alt+Math.sin(s.ph)*.6;e.vx=clamp(tx-e.x,-1,1)*o.spd;e.vy=clamp(ty-e.y,-1,1)*o.spd*.8;e.face=toP(e);
      if(s.t<=0&&Math.abs(p.x-e.x)<8){s.m='wind';s.t=o.wind;AU.sfx('tele');}}
    else if(s.m==='wind'){e.tell=1;e.vx=-e.face*1.4;e.vy=1;if(s.t<=0){const dx=p.x-e.x,dy=p.y+.6-e.y,d=Math.hypot(dx,dy)||1;s.dx=dx/d;s.dy=dy/d;s.m='lunge';s.t=o.len;}}
    else{e.vx=s.dx*o.lunge;e.vy=s.dy*o.lunge;e.hot=true;if(s.t<=0){s.m='drift';s.t=rnd(o.gap,o.gap*1.8);s.side=-s.side;}}}};}

function buildScenery(th,x0,x1,plats){const T=THEME[th],cx=(x0+x1)/2,ww=Math.ceil((x1-x0+90)/12)*12;R.setEnv(T.env);
  // floor: three depth bands for the top surface, then a tiled earth face just in front of the play line
  R.add(mk([P('box',0,-15,ww*1.6,30,mix(T.top,0x000000,.06),{d:.2})],cx,0,-9,{st:true}));R.add(mk([P('box',0,-15,ww*1.3,30,T.top,{d:.2})],cx,0,-4.4,{st:true}));R.add(mk([P('box',0,-15,ww*1.1,30,mix(T.top,0xffffff,.1),{d:.2})],cx,0,-1.3,{st:true}));
  const tiles=[P('box',0,-17.9,ww,30,T.front,{d:.2,e:1})];for(let x=-ww/2;x<ww/2;x+=6)tiles.push(P('img',x+3,-1.5,6.03,3,0,{img:tileTex(T.top,T.front),op:1,z:.05}));R.add(mk(tiles,cx,0,.75,{st:true}));
  for(const L of T.layers){const z=L[0],m=(z<-20?40:z<-10?24:10);for(let x=x0-m;x<x1+m;x+=L[1]*rnd(.65,1.35)){if(z>0&&Math.random()<.35)continue;R.add(mk(pick(L[3])(),x,L[4]?L[4]+rnd(-2,3):z>0?-.55:0,z+rnd(-1,1)*(z>0?.3:1),{s:L[2]*rnd(.8,1.25)*(z>0?.8:1),st:true}));}}
  for(const q of plats||[]){const w=q.x1-q.x0;R.add(mk([P('rbox',0,-.2,w+.1,.4,T.top,{d:1.7}),P('img',0,-.5,w+.3,1.1,0,{img:platTex(T.top,T.front),z:.87})],(q.x0+q.x1)/2,q.y,0,{st:true}));}
  // walls of Static at the arena ends
  for(const x of[x0-1.4,x1+1.4])R.add(mk([P('box',0,5,2.4,10,mix(T.env.fog,0x201a4b,.45),{d:6}),P('box',0,5,2.6,10,mix(T.env.fog,0x201a4b,.6),{d:.2,z:3.2})],x,0,0,{st:true}));
}

    if(!boss){const np=rint(0,2);for(let i=0;i<np;i++){const cx=wd*(i+1)/(np+1)+rnd(-2,2),hw=rnd(1.8,2.8);w.plats.push({x0:cx-hw,x1:cx+hw,y:2.1});}}

let lastTs=0;const PERF={n:0,sum:0,avg:16,worst:0,slow:0};
function frame(ts){requestAnimationFrame(frame);const real=(ts-lastTs)/1000||0,raw=Math.min(.1,real);lastTs=ts;let dt=Math.min(.034,raw);
  // watch the frame time and cut effects (particles, lights, outlines, resolution) before the game slows down
  if(UI.mode==='none'&&real<.3){PERF.sum+=real;PERF.n++;if(PERF.n>=50){PERF.avg=PERF.sum/PERF.n*1000;PERF.worst=Math.max(PERF.worst,PERF.avg);PERF.sum=PERF.n=0;if(PERF.avg>23&&R.q>0){R.setQ(R.q-1);PERF.drops=(PERF.drops||0)+1;}
      else if(PERF.avg>36&&R.q===0&&R.mode==='three'&&++PERF.slow>=2)R.fallback('the 3D renderer was too slow on this device');}}
  if(!G.scene)return;
  if(IN.press.pause){IN.press.pause=0;if(UI.mode==='none')UI.pause();}
  if(UI.mode==='slow')dt*=.07;else if(UI.mode!=='none')dt=0;
  if(G.stop>0&&dt>0){G.stop-=raw;dt=0;R.cam.shake=Math.max(0,R.cam.shake-raw);}
  if(dt>0){G.t+=dt;G.scene.update(dt);IN.clear();}else if(UI.mode!=='none'&&UI.mode!=='slow')IN.clear();
  R.render(ctx=>G.scene.draw(ctx));HUD.update();}

  if(rk('format'))while(FORMS.length<4)FORMS.push(FORM_EXTRA[FORMS.length-1]);
  GAME.go(HubScene);UI.mode='title';$('#tnote').textContent=sysNote();
  $('#bstart').onclick=()=>{AU.init();AU.setMute(AU.muted);$('#title').classList.add('hide');$('#hud').classList.remove('hide');$('#touch').classList.remove('hide');UI.mode='none';AU.play('hub');HUD.refresh();
    if(R.mode!=='three')toast('Canvas mode: '+R.note+'.');
    if(!SV.d.tut.move){SV.d.tut.move=1;SV.save();setTimeout(()=>toast(IN.usedKb?'A/D move, Space jump, J hit, K dodge.':'Left thumb moves. Right buttons hit, jump and dodge.'),900);setTimeout(()=>toast('Talk to Ember, the mentor in orange.'),4200);}
    else if(innerHeight>innerWidth)setTimeout(()=>toast('Tip: turn your phone sideways for a wider view.'),900);};
  $('#bmute').onclick=()=>{AU.init();toggleMute();};$('#bpause').onclick=()=>UI.pause();
  addEventListener('pointerdown',()=>{if(UI.mode!=='title')AU.init();},{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(UI.mode==='none'&&G.run)UI.pause();if(AU.ctx)AU.ctx.suspend().catch(()=>{});}else if(AU.ctx)AU.ctx.resume().catch(()=>{});});
  addEventListener('error',e=>{try{toast('Something broke: '+(e.message||'unknown error'));}catch(_){}});
  requestAnimationFrame(frame);}
boot();

</script>
